<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500">
  <rect width="1080" height="500" fill="#0b1220"/>
  <style>
    .title { font: 700 20px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7fafc; }
    .label { font: 600 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7fafc; }
    .text { font: 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9fb0c7; }
    .mono { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #9fb0c7; }
    .muted { fill: #9fb0c7; }
    .ok { fill: #38d47a; }
    .warn { fill: #f2b84b; }
    .accent { fill: #b28cff; }
    .cyan { fill: #40c7ff; }
    .pearl { fill: #f7fafc; }
    .box { fill: #111c2f; stroke: #5f7394; stroke-width: 1.4; rx: 10; }
    .box2 { fill: #15253d; stroke: #5f7394; stroke-width: 1.4; rx: 10; }
    .store { fill: #0b1220; stroke: #40c7ff; stroke-width: 1.4; rx: 10; }
    .line { stroke: #9fb0c7; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .line2 { stroke: #b28cff; stroke-width: 2; fill: none; marker-end: url(#arrow2); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#9fb0c7"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#b28cff"/>
    </marker>
  </defs>
<text x="40" y="52" class="title">Security status in the observability cockpit</text>
<rect x="42" y="88" width="996" height="350" rx="18" fill="#07111f" stroke="#5f7394"/>
<text x="70" y="128" class="mono accent">milliways observability -- secure workspace</text>
<text x="70" y="170" class="mono ok">SEC WARN 2     mode warn     workspace ./service-api</text>
<text x="70" y="210" class="mono pearl">startup: current     dependency scan: 10:02Z     client: codex warn</text>
<text x="70" y="250" class="mono warn">sec detail: missing gitleaks, govulncheck; package scripts need review</text>
<text x="70" y="306" class="label">CRA KPIs</text>
<text x="70" y="340" class="mono">readiness:        71%</text>
<text x="350" y="340" class="mono">evidence:         5 / 7 present</text>
<text x="650" y="340" class="mono">vuln handling:    documented</text>
<text x="70" y="390" class="mono cyan">next: refresh SBOM after dependency file changes</text>
<text x="70" y="462" class="text muted">Same signal flows through the status bar, /security, milliwaysctl, and the lower-left cockpit.</text>
</svg>
